<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M.U.R Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:teal;color: white;font-family:Arial;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:90%;max-width:400px;background: black;padding:25px;border-radius:20px;box-shadow:0 0 25px #000}
h1{text-align:center;color:darkgray;}
input,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:0}
input{background: black;color:blue;}
button{background:darkgray; color:teal;font-weight:bold}
a{display:block;text-align:center;color: darkgray;margin-top:15px}
#pesan{text-align:center;margin-top:15px;color: darkgreen}
video{border-radius:15px;}
</style>
</head>
<body>
<div class="box">
<video autoplay muted loop playsinline controls style="width:100%; height:auto;">
  <source src="Spiderman.mp4" type="video/mp4">
</video>
<h1>«M.U.R»</h1>
<input id="email" type="email" placeholder="Email / Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">MASUK</button>
<div id="pesan"></div>
<a href="verifikasi.html" onclick="window.location.href='verifikasi.html'; return false;">Buat akun</a>
</div>
<script>
function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const akun=JSON.parse(localStorage.getItem("akunMUR")||"null");

 if(!akun){
   pesan.textContent="Akun belum terdaftar.";
   return;
 }

 if(email===akun.username && password===akun.password){
   localStorage.setItem("sesiMUR",JSON.stringify({username:email}));
   location.href="home.html";
 }else{
   pesan.textContent="Username atau password salah!";
 }
}
</script>
</body>
</html>
